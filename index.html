<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tauch-Logbuch</title>
  <meta name="description" content="Persönliches Tauch-Logbuch – läuft offline auf dem Handy, alle Daten bleiben auf dem Gerät.">
  <meta name="theme-color" content="#0b5ea8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#08111d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tauch-Logbuch">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body data-tab="logbuch">
  <div id="testbanner" class="testbanner" hidden>
    <span><strong>TESTMODUS</strong> – Beispieldaten. Deine echten Daten bleiben unberührt.</span>
    <button type="button" id="testbanner-exit" class="testbanner-btn">Beenden</button>
  </div>

  <header class="topbar">
    <button type="button" id="back" class="back" hidden aria-label="Zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Zurück</span>
    </button>
    <h1 id="title">Logbuch</h1>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading">Lade …</p>
  </main>

  <nav class="tabbar" aria-label="Bereiche">
    <a href="#logbuch" data-tab="logbuch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>
      <span>Logbuch</span>
    </a>
    <a href="#brevets" data-tab="brevets">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/><path d="M5.8 16.2a3.4 3.4 0 0 1 6.4 0"/><path d="M14.5 10h3.5M14.5 13.5h3.5"/></svg>
      <span>Brevets</span>
    </a>
    <a href="#notfall" data-tab="notfall" class="tab-notfall">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4.5"/><path d="M12 17.3v.2"/></svg>
      <span>Notfall</span>
    </a>
    <a href="#einstellungen" data-tab="einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Einstellungen</span>
    </a>
  </nav>

  <div id="modal-root"></div>
  <div id="lightbox" class="lightbox" hidden>
    <img alt="">
    <button type="button" class="lightbox-close" aria-label="Schließen">×</button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Bitte JavaScript aktivieren – ohne funktioniert das Logbuch nicht.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
